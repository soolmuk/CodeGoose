version: "1.0.0"
title: "CodeGoose PR Review"
description: >
  Review a downloaded GitHub pull request diff for correctness bugs, security
  issues, performance problems, and design flaws, then write a graded review
  (Blocking / Warning / Suggestion / Highlight) with a final verdict.

# 이 레시피는 단독 실행됩니다. 언어/특화 지시는
# --params language= "..." --params instructions="..." 로 주입하세요.
# 중앙 공유 위치: soolmuk/CodeGoose (GOOSE_RECIPE_GITHUB_REPO 지원)
parameters:
  - key: pr_directory
    input_type: string
    requirement: required
    description: Path to the directory with pr.md and pr.diff
  - key: language
    input_type: string
    requirement: optional
    description: Output language for review prose (e.g. Korean, English, Japanese, Chinese)
    default: "Korean (한국어)"
  - key: instructions
    input_type: string
    requirement: optional
    description: Extra review focus instructions from the triggered event
    default: ""

extensions:
  - type: builtin
    name: developer

prompt: |
  Review the code changes downloaded from a GitHub pull request.
  The PR metadata is located at {{ pr_directory }}/pr.md.
  The proposed diff you are to review is located at {{ pr_directory }}/pr.diff.
  The base branch is checked out in the working directory.
  Use the tools you have to read the diff and examine surrounding code for context.

  ## Review scope
  - Correctness bugs, security issues, performance problems, design flaws.
  - Be precise and concrete; cite exact file paths / line numbers and explain the failure mode.
  - Evaluate necessity: could existing functions/types be extended instead of adding new code?
    Search the codebase (e.g. with ripgrep) before claiming something is missing.
  - Duplication and shadow state: is there a single source of truth?
  - Silent error paths (default values hiding errors), unhandled Result returns,
    resource lifecycle (handles/threads not closed on all paths), concurrency hazards.
  - Comments that restate code or are wrong; TODOs without owners.
  - Tests that set env vars or do not test real behavior.

  ## Anti-hallucination rules
  - Search before claiming something is "missing".
  - Say "I couldn't verify" rather than asserting something is wrong.
  - 3 verified issues are better than 15 speculative ones.
  - Do NOT run build/test/format commands and do NOT modify any files.
    This is a read-only review. Do not mention extensions at all.

  ## Line citation rules (CI parses these mechanically)
  - Inside Blocking / Warnings / Suggestions, EVERY finding MUST start with a
    line citation in one of these forms, backticked or plain:
    `path/to/file.py:188` or `path/to/file.py:188-192`.
  - Use NEW-side line numbers from diff hunks (`@@ -a,b +c,d @@`). Both added lines (`+`)
    and context lines (` `) within hunks are valid anchors. Never cite line numbers
    outside the diff hunks.
  - NEVER use comma-separated multi-line syntax (e.g. `file.py:103,139,165` is
    strictly forbidden). Use only a single line `file.py:188` or a continuous range `file.py:188-192`.
  - When citing code or identifiers, include the exact identifier in backticks
    (e.g. `calculateTotal` or `userId`) in the finding body to aid automated line anchoring.
  - For multi-line ranges (`path:10-15`), ensure both start and end lines are within
    the same diff hunk.
  - Issues concerning untouched lines or general architecture belong in `## Summary`,
    not under Blocking / Warnings / Suggestions.
  - One finding = one bullet = one file/line. Keep at most 10 anchored findings
    total (highest severity first); move the rest into a closing note.

  ## Extra review instructions (may be empty)
  {{ instructions }}

  ## Language Requirements (CRITICAL - STRICTLY ENFORCED)
  - You MUST write all review prose, summaries, explanations, descriptions, suggestions, highlights, and verdict notes in {{ language }}.
  - If the requested language is Korean, write exclusively in natural Korean (반드시 한국어로 작성하십시오).
  - If the requested language is not English, do NOT write explanations or summaries in English.
  - The ONLY elements that remain in English are:
    1. Exact category heading lines (## Summary, ## 🔴 Blocking Issues, ## 🟡 Warnings, ## 🟢 Suggestions, ## ✅ Highlights, ## Verdict)
    2. Code snippets, variable names, and file paths
    3. The verdict keyword (APPROVE or REQUEST_CHANGES)

  ## Output format
  Begin your final answer directly with `## Summary` and nothing before it.
  Always include all category headers:

  ## Summary
  <1-3 sentences in {{ language }}: what the PR does and overall assessment>

  ## 🔴 Blocking Issues
  - `path/to/file.ext:line`: <설명 in {{ language }}> (If none: short no-findings note in {{ language }})

  ## 🟡 Warnings
  - `path/to/file.ext:line`: <설명 in {{ language }}> (If none: short no-findings note in {{ language }})

  ## 🟢 Suggestions
  - `path/to/file.ext:line`: <제안 in {{ language }}> (If none: short no-findings note in {{ language }})

  ## ✅ Highlights
  - <잘한 점 in {{ language }}> (If none: short positive feedback note in {{ language }})

  ## Verdict
  APPROVE | REQUEST_CHANGES - <1 sentence justification in {{ language }}> (Use REQUEST_CHANGES only if at least one Blocking issue)

  ### MANDATORY REMINDER:
  All review descriptions, explanations, and summaries MUST be written in {{ language }}. Category headings must remain in English as shown above.

settings:
  temperature: 0.2
  max_turns: 40

response:
  json_schema:
    type: object
    properties:
      summary:
        type: string
        description: What the PR does and overall assessment
      blocking:
        type: array
        items:
          type: object
          properties:
            file:
              type: string
            line:
              type: string
            description:
              type: string
            evidence:
              type: string
          required: [file, description]
      warnings:
        type: array
        items:
          type: object
          properties:
            file:
              type: string
            line:
              type: string
            description:
              type: string
      suggestions:
        type: array
        items:
          type: string
      highlights:
        type: array
        items:
          type: string
      verdict:
        type: string
        enum: [APPROVE, REQUEST_CHANGES]
    required: [summary, verdict]