# Rendered by soolmuk/CodeGoose scripts/render.py - do not hand-edit.
name: CodeGoose AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  # gh pr view queries the GraphQL statusCheckRollup (commit checks); on
  # private repos the job token cannot read it without these scopes and
  # the gather step fails (found via kai-cameo-mcp #105, restored at the
  # template level so rendered files never regress). The rollup includes
  # checkSuite.workflowRun, which additionally needs actions:read —
  # without ANY actions scope the same query fails with "Resource not
  # accessible by integration" (kai-cameo-mcp #106 CI, 2026-09-01).
  actions: read
  checks: read
  statuses: read

concurrency:
  group: codegoose-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codegoose-review:
    name: CodeGoose AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        # actions/checkout v4 (pinned to the full commit SHA of the v4 branch
        # head; moving tags are not immutable enough for a workflow that
        # executes remote scripts with secrets in scope).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # The goose review step runs an LLM with shell access over
          # attacker-controlled PR diff content; a prompt injection must
          # not find the job token in .git/config. No step below relies
          # on persisted git credentials (gh calls pass GH_TOKEN
          # explicitly; the goose step is deliberately token-free).
          persist-credentials: false

      - name: Install goose CLI
        env:
          # Pinned to the v1.48.0 tag (a moving tag like `stable` can serve
          # different bytes run-to-run; the SHA-256 below is the official
          # GitHub digest of this exact release asset and is verified before
          # the script is executed — never `curl | bash` unverified).
          GOOSE_INSTALL_URL: https://github.com/aaif-goose/goose/releases/download/v1.48.0/download_cli.sh
          GOOSE_INSTALL_SHA256: ab5ae40513348ec4e6047cc7338040aab2df5246800c111d22065766ba6013f0
        run: |
          curl -fsSL "$GOOSE_INSTALL_URL" -o download_cli.sh
          echo "$GOOSE_INSTALL_SHA256  download_cli.sh" | sha256sum --strict --check -
          GOOSE_VERSION=v1.48.0 CONFIGURE=false GOOSE_BIN_DIR=/home/runner/.local/bin bash download_cli.sh
          echo "/home/runner/.local/bin" >> "$GITHUB_PATH"

      - name: Configure goose
        run: |
          mkdir -p ~/.config/goose
          cat <<'EOF' > ~/.config/goose/config.yaml
          GOOSE_PROVIDER: __PROVIDER__
          GOOSE_MODEL: __GOOSE_MODEL__
          keyring: false
          EOF

      - name: Gather PR information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" > pr.diff
          {
            echo "# Pull Request"
            gh pr view "${{ github.event.pull_request.number }}"
            echo ""
            echo "# Files Changed"
            gh pr diff "${{ github.event.pull_request.number }}" --name-only
            echo ""
            echo "# Changes (diff)"
            cat pr.diff
          } > changes.txt
          # Shared helpers: downloaded from the LATEST CodeGoose release
          # (release-only distribution model; installed workflows track
          # releases automatically, main is never fetched). INTEGRITY gate:
          # every asset fetched here must be LISTED in the release's
          # SHA256SUMS (explicit grep guard — --ignore-missing only tolerates
          # manifest entries for assets not yet fetched) and its digest
          # verified before use. This is asset/transport integrity, NOT
          # authenticity: SHA256SUMS rides the same release channel, so a
          # fully compromised release account could replace it too (the
          # accepted trade-off of the auto-tracking model).
          curl -fsSL __RECIPES_BASE__/SHA256SUMS -o SHA256SUMS
          [ -s SHA256SUMS ] || { echo "Failed to download SHA256SUMS manifest" >&2; exit 1; }
          curl -fsSL __RECIPES_BASE__/inline_threads.py -o inline_threads.py
          [ -s inline_threads.py ] || { echo "Failed to download inline_threads.py helper" >&2; exit 1; }
          grep -q "  inline_threads.py$" SHA256SUMS || { echo "SHA256SUMS does not list inline_threads.py" >&2; exit 1; }
          sha256sum --strict --check --ignore-missing SHA256SUMS
          #[verify:begin]
          # Verification-gate helpers (issue #10): downloaded even when the
          # gate runs; the whole region (downloads included) is removed
          # when rendering with --verification off.
          curl -fsSL __RECIPES_BASE__/verify_findings.py -o verify_findings.py
          [ -s verify_findings.py ] || { echo "Failed to download verify_findings.py helper" >&2; exit 1; }
          grep -q "  verify_findings.py$" SHA256SUMS || { echo "SHA256SUMS does not list verify_findings.py" >&2; exit 1; }
          curl -fsSL __RECIPES_BASE__/instructions.reflection.md -o instructions.reflection.md
          [ -s instructions.reflection.md ] || { echo "Failed to download reflection instructions" >&2; exit 1; }
          grep -q "  instructions.reflection.md$" SHA256SUMS || { echo "SHA256SUMS does not list instructions.reflection.md" >&2; exit 1; }
          #[verify:end]

      - name: Write instructions
        run: |
          # Review instructions are a release asset: downloaded at CI
          # runtime (not baked in at render time) so every install uses
          # the latest reviewed instructions. __STYLE_ASSET__ selects
          # graded-review vs changes-summary; the lang subcommand
          # substitutes __LANGUAGE__ and fails on leftover tokens.
          curl -fsSL __RECIPES_BASE__/__STYLE_ASSET__ -o instructions.template.md
          [ -s instructions.template.md ] || { echo "Failed to download review instructions" >&2; exit 1; }
          # The manifest keys this asset by its RELEASE basename, so verify via
          # a rewritten line: a plain --ignore-missing check would silently
          # SKIP it (the local name never matches the manifest key) and its
          # digest would never be enforced.
          grep "  __STYLE_ASSET__$" SHA256SUMS > /tmp/style.line || { echo "SHA256SUMS does not list the instructions asset" >&2; exit 1; }
          awk -v l="instructions.template.md" '{print $1 "  " l}' /tmp/style.line > /tmp/style.sum
          sha256sum --strict --check /tmp/style.sum
          python3 inline_threads.py lang \
            --instruction-file instructions.template.md \
            --language "__LANGUAGE__" \
            --out instructions.txt
          cat changes.txt >> instructions.txt

      - name: Run goose
        # Secret isolation: this step runs an LLM over ATTACKER-CONTROLLED
        # diff content, so it receives ONLY the provider API key — no
        # GH_TOKEN. A prompt injection therefore cannot exfiltrate repo
        # credentials (the provider key is still exposed to the model by
        # necessity; scope it tightly and rotate on suspicion).
        # GOOSE_MODE stays auto: the reflection pass must read repository
        # files to verify findings (read-only per the instructions); a chat
        # mode would disable that verification.
        env:
          __API_KEY_NAME__: ${{ secrets.__API_KEY_NAME__ }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          goose run --instructions instructions.txt > raw.txt
          python3 inline_threads.py extract --raw raw.txt --out body.md || true
          if [ ! -s body.md ]; then
            echo "goose produced no final review (no '## Summary' sentinel in output)" >&2
            tail -n 40 raw.txt >&2 || true
            exit 1
          fi
          #[verify:begin]
          # Verification gate (issue #10): single reflection pass + merge.
          # Same step run block: the provider key binding stays exactly 1.
          # Issue: verification (reflection) pass may run a different
          # model than the review pass. __GOOSE_VERIFY_MODEL__ is
          # substituted with the review model by default (single-model
          # behavior preserved); render.py --verify-model overrides it.
          # Rewriting the global config.yaml here only affects the
          # remaining goose invocations in this step (reflection + retry).
          cat <<'VEOF' > ~/.config/goose/config.yaml
          GOOSE_PROVIDER: __PROVIDER__
          GOOSE_MODEL: __GOOSE_VERIFY_MODEL__
          keyring: false
          VEOF
          # (The old "skip when the PR head moved" pre-check read the same
          #  event payload twice — head.sha vs head.sha — so it never fired;
          #  the posting step's live `gh pr view` check is the real guard.)
          python3 verify_findings.py extract --body body.md --out findings.json
          if [ -s findings.json ] && [ "$(python3 -c 'import json;print(len(json.load(open("findings.json"))))')" != "0" ]; then
            cat instructions.reflection.md > reflection_input.txt
            {
              echo ""
              echo "## Findings under verification"
              cat findings.json
              echo ""
              echo "## Diff context (trimmed around citations)"
              python3 verify_findings.py hunks --diff pr.diff --findings findings.json --out hunks.txt
              cat hunks.txt
            } >> reflection_input.txt
            goose run --instructions reflection_input.txt > reflect_raw.txt
            if python3 verify_findings.py reflect-parse --raw reflect_raw.txt --out scores.json; then
              python3 verify_findings.py merge --body body.md --scores scores.json \
                --profile __VERIFY_PROFILE__ --mode __VERIFY_MODE__ \
                --out-final body.md --out-dropped dropped.json \
                --lang "__LANGUAGE__"
              if [ -s dropped.json ]; then
                echo "verification gate: $(python3 -c 'import json;d=json.load(open("dropped.json"));print(f"{d[\"kept\"]} kept / {d[\"demoted\"]} demoted / {d[\"dropped\"]} dropped")')" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              # One corrective retry, then fail-open (D-2). The retry
              # carries the ACTUAL parse failure reason so the model
              # can correct the specific mistake (not a blind repeat).
              printf '%s\n' \
                'Your previous reply could not be parsed. Output MUST be exactly:' \
                '## Reflection' \
                '```json' \
                '{"findings":[{"anchor":"<echo exactly>","score":<0-10>,"why":"<English>"}]}' \
                '```' \
                'No prose before or after the json block.' > correction.txt
              { echo ""; echo "Parse failure reason:"; \
                python3 verify_findings.py reflect-parse --raw reflect_raw.txt --out /dev/null 2>&1 || true; \
              } >> correction.txt
              cat correction.txt > reflection_retry.txt
              cat reflection_input.txt >> reflection_retry.txt
              goose run --instructions reflection_retry.txt > reflect_raw2.txt
              if python3 verify_findings.py reflect-parse --raw reflect_raw2.txt --out scores.json; then
                python3 verify_findings.py merge --body body.md --scores scores.json \
                  --profile __VERIFY_PROFILE__ --mode __VERIFY_MODE__ \
                  --out-final body.md --out-dropped dropped.json \
                  --lang "__LANGUAGE__"
                if [ -s dropped.json ]; then
                  echo "verification gate: $(python3 -c 'import json;d=json.load(open("dropped.json"));print(f"{d[\"kept\"]} kept / {d[\"demoted\"]} demoted / {d[\"dropped\"]} dropped")')" >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                { python3 verify_findings.py banner --lang "__LANGUAGE__"; echo ""; } | cat - body.md > body_banner.md && mv body_banner.md body.md
              fi
            fi
          fi
          #[verify:end]

      - name: Redact provider key from review output
        # Defense against prompt-injection echo: the model step receives the
        # provider API key, and a hostile PR diff could try to make the model
        # repeat it into the review body — which is posted to the PR thread.
        # The key never appears as a command argument or step-log line: it is
        # exported by the runner (not echoed), read via a python script that
        # only reports counts, and every review artifact is scrubbed before
        # anything is posted or uploaded.
        env:
          __API_KEY_NAME__: ${{ secrets.__API_KEY_NAME__ }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          key = os.environ.get("__API_KEY_NAME__", "")
          if key:
              for name in ("body.md", "raw.txt", "reflect_raw.txt", "reflect_raw2.txt"):
                  f = pathlib.Path(name)
                  if f.exists():
                      text = f.read_text(errors="replace")
                      if key in text:
                          f.write_text(text.replace(key, "[REDACTED_API_KEY]"))
              body = pathlib.Path("body.md")
              if body.exists() and key in body.read_text(errors="replace"):
                  print("FATAL: provider API key still present in body.md after redaction", file=os.sys.stderr)
                  raise SystemExit(1)
          print("redaction pass complete")
          PY

      - name: Post review to PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Split the machine-readable threads block from the summary and anchor
          # every thread to the unified diff. Findings that cannot be anchored
          # are demoted into a "Not anchored to the diff" recap in the summary.
          # Guard against the PR head moving after pr.diff was gathered:
          # posting against a stale commit mis-anchors inline comments.
          CURRENT_SHA="$(gh pr view "${{ github.event.pull_request.number }}" \
            --json headRefOid --jq .headRefOid)"
          if [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "PR head moved since this run started ($HEAD_SHA -> $CURRENT_SHA);" >&2
            echo "a newer run is posting the fresh diff. Skipping inline review." >&2
            exit 0
          fi
          python3 inline_threads.py prepare --body body.md --diff pr.diff \
            --out-clean body_clean.md --out-threads threads.json
          if [ ! -s body_clean.md ]; then
            echo "review body is empty after removing the machine-readable threads block" >&2
            exit 1
          fi
          # CodeRabbit-style posting: summary as the review body, validated
          # findings as comments anchored to diff lines. The GITHUB_TOKEN cannot
          # submit APPROVE events, so the review is always COMMENT.
          if jq -e 'length > 0' threads.json >/dev/null 2>&1 && [ -n "$HEAD_SHA" ]; then
            python3 inline_threads.py github-payload --body-clean body_clean.md \
              --threads threads.json --commit-id "$HEAD_SHA" --out review_payload.json
            if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
                -X POST -H "Content-Type: application/json" \
                --input review_payload.json > review_result.json 2> review_err.txt; then
              echo "posted review with inline comments: $(jq -r '.comments | length' review_result.json 2>/dev/null || echo '?')" >&2
            else
              echo "WARN: inline review posting failed; falling back to a plain comment" >&2
              cat review_err.txt >&2 || true
              gh pr comment "${{ github.event.pull_request.number }}" --body-file body_clean.md
            fi
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file body_clean.md
          fi

      - name: Upload verification gate artifacts
        if: always()
        # actions/upload-artifact v4 (pinned to the full commit SHA; see above).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-gate-${{ github.event.pull_request.number }}
          path: |
            findings.json
            scores.json
            dropped.json
            body.md
          if-no-files-found: ignore